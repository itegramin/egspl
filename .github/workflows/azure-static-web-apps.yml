name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - uat
      - prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - prod

jobs:
  # -------------------------------------------------------------
  # 1. UAT Deployment: Runs on git push to the 'uat' branch
  # -------------------------------------------------------------
  deploy_uat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    name: Deploy UAT (Push to uat)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy to UAT
        id: builddeploy_uat
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_POLITE_FOREST_025553500 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

  # -------------------------------------------------------------
  # 2. Production Deployment: Runs on pull requests targeting 'prod'
  #    (creates staging preview) and on push to 'prod' (live release)
  # -------------------------------------------------------------
  deploy_prod:
    if: (github.event_name == 'pull_request' && github.base_ref == 'prod' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    name: Deploy Prod (PR Preview & Release)
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Build And Deploy to Prod
        id: builddeploy_prod
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_OCEAN_0DF4CC600 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          api_location: ""
          output_location: "dist"
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

  # -------------------------------------------------------------
  # 3. Clean up PR Staging Environment when PR targeting 'prod' closes
  # -------------------------------------------------------------
  close_prod_pr:
    if: github.event_name == 'pull_request' && github.base_ref == 'prod' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Prod PR Staging Environment
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_OCEAN_0DF4CC600 }}
          action: "close"