name: Deploy All Apps

on:
  push:
    branches:
      - uat
      - prod
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - prod

jobs:
  # -------------------------------------------------------------
  # 0. RLS Regression Guard
  # -------------------------------------------------------------
  rls_regression:
    if: |
      (github.event_name == 'pull_request' && github.base_ref == 'prod' && github.event.action != 'closed') ||
      (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    runs-on: ubuntu-latest
    name: RLS Policy Regression Guard
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Install Playwright browsers
        run: pnpm --filter @egspl/dashboard exec playwright install --with-deps chromium

      - name: Run RLS regression tests
        run: pnpm --filter @egspl/dashboard exec playwright test ../../e2e/rls-policy.spec.ts --config ../../playwright.config.ts --reporter=list
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

  # -------------------------------------------------------------
  # 1. Deploy Landing (UAT)
  # -------------------------------------------------------------
  deploy_landing_uat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    name: Deploy Landing UAT
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Landing
        run: pnpm --filter @egspl/landing build
        env:
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_UAT }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL_UAT }}

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_LANDING_UAT }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_LANDING_UAT }}
          package: apps/landing/dist
          startup-command: node server.cjs

  # -------------------------------------------------------------
  # 2. Deploy Auth (UAT)
  # -------------------------------------------------------------
  deploy_auth_uat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    name: Deploy Auth UAT
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Auth
        run: pnpm --filter @egspl/auth build
        env:
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_UAT }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL_UAT }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL_UAT }}
          VITE_AUTH_COOKIE_DOMAIN: ${{ vars.VITE_AUTH_COOKIE_DOMAIN_UAT || '.egraminservices.com' }}
          VITE_AUTH_STORAGE_KEY: sb-auth-token-uat
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_AUTH_UAT }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AUTH_UAT }}
          package: apps/auth/dist
          startup-command: node server.cjs

  # -------------------------------------------------------------
  # 3. Deploy Dashboard (UAT)
  # -------------------------------------------------------------
  deploy_dashboard_uat:
    if: github.event_name == 'push' && github.ref == 'refs/heads/uat'
    runs-on: ubuntu-latest
    name: Deploy Dashboard UAT
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Dashboard
        run: pnpm --filter @egspl/dashboard build
        env:
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_UAT }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL_UAT }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL_UAT }}
          VITE_AUTH_COOKIE_DOMAIN: ${{ vars.VITE_AUTH_COOKIE_DOMAIN_UAT || '.egraminservices.com' }}
          VITE_AUTH_STORAGE_KEY: sb-auth-token-uat
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_DASHBOARD_UAT }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DASHBOARD_UAT }}
          package: apps/dashboard/dist
          startup-command: node server.cjs

  # -------------------------------------------------------------
  # 4. Deploy Landing (Prod)
  # -------------------------------------------------------------
  deploy_landing_prod:
    if: (github.event_name == 'pull_request' && github.base_ref == 'prod' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    needs: rls_regression
    runs-on: ubuntu-latest
    name: Deploy Landing Prod
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Landing
        run: pnpm --filter @egspl/landing build
        env:
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_PROD }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL_PROD }}

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_LANDING_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_LANDING_PROD }}
          package: apps/landing/dist
          startup-command: node server.cjs

  # -------------------------------------------------------------
  # 5. Deploy Auth (Prod)
  # -------------------------------------------------------------
  deploy_auth_prod:
    if: (github.event_name == 'pull_request' && github.base_ref == 'prod' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    needs: rls_regression
    runs-on: ubuntu-latest
    name: Deploy Auth Prod
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Auth
        run: pnpm --filter @egspl/auth build
        env:
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_PROD }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL_PROD }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL_PROD }}
          VITE_AUTH_COOKIE_DOMAIN: ${{ vars.VITE_AUTH_COOKIE_DOMAIN_PROD || '.egraminservices.com' }}
          VITE_AUTH_STORAGE_KEY: sb-auth-token-prod
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_AUTH_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_AUTH_PROD }}
          package: apps/auth/dist
          startup-command: node server.cjs

  # -------------------------------------------------------------
  # 6. Deploy Dashboard (Prod)
  # -------------------------------------------------------------
  deploy_dashboard_prod:
    if: (github.event_name == 'pull_request' && github.base_ref == 'prod' && github.event.action != 'closed') || (github.event_name == 'push' && github.ref == 'refs/heads/prod')
    needs: rls_regression
    runs-on: ubuntu-latest
    name: Deploy Dashboard Prod
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Build Dashboard
        run: pnpm --filter @egspl/dashboard build
        env:
          VITE_AUTH_URL: ${{ vars.VITE_AUTH_URL_PROD }}
          VITE_DASHBOARD_URL: ${{ vars.VITE_DASHBOARD_URL_PROD }}
          VITE_LANDING_URL: ${{ vars.VITE_LANDING_URL_PROD }}
          VITE_AUTH_COOKIE_DOMAIN: ${{ vars.VITE_AUTH_COOKIE_DOMAIN_PROD || '.egraminservices.com' }}
          VITE_AUTH_STORAGE_KEY: sb-auth-token-prod
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

      - name: Deploy to Azure App Service
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME_DASHBOARD_PROD }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_DASHBOARD_PROD }}
          package: apps/dashboard/dist
          startup-command: node server.cjs
